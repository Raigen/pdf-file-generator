[workspace]
resolver = "3"
members = ["crates/invoice-pdf-core", "crates/invoice-pdf-cli", "crates/invoice-pdf-service", "crates/invoice-pdf-background"]

[workspace.package]
edition = "2024"
license = "UNLICENSED"
publish = false
version = "0.1.0"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
invoice-pdf-core = { path = "crates/invoice-pdf-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
subsetter = { version = "0.2", default-features = false }
ttf-parser = "0.25"
